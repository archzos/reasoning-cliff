[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-cliff"
version = "0.1.0"
description = "Reproducible harness for reasoning-collapse experiments with token-budget controls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ArchzOS" }]
dependencies = [
  "duckdb>=1.0,<2",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "boto3>=1.34,<2",
  "openai>=1.40,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
reasoning-cliff = "reasoning_cliff.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["reasoning_cliff*"]
